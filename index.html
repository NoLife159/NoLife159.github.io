<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chotchayut Biewbangkoed - Space 3D Portfolio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #030308;
            color: #ffffff;
        }

        /* Container สำหรับ Three.js Canvas */
        #webgl-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* UI Content Overlay */
        .ui-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 40px;
        }

        /* Header / Hero Text */
        header {
            background: rgba(15, 15, 30, 0.4);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 242, 254, 0.2);
            padding: 20px 30px;
            border-radius: 16px;
            max-width: 450px;
            pointer-events: auto;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.6);
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 5px;
            background: linear-gradient(45deg, #00f2fe, #4facfe, #9b51e0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.subtitle {
            font-size: 0.9rem;
            color: #8ab4f8;
            margin-bottom: 15px;
        }

        .bio {
            font-size: 0.95rem;
            line-height: 1.5;
            color: #d1d5db;
        }

        /* Instructions Footer */
        footer {
            align-self: flex-end;
            background: rgba(5, 5, 15, 0.6);
            backdrop-filter: blur(8px);
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 0.85rem;
            color: #8a8f9e;
            border: 1px solid rgba(0, 242, 254, 0.15);
        }

        /* Loading Screen */
        #loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #030308;
            z-index: 99;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.5s ease;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(0, 242, 254, 0.1);
            border-radius: 50%;
            border-top-color: #00f2fe;
            animation: spin 1s ease-in-out infinite;
        }

        .progress-text {
            margin-top: 15px;
            color: #8ab4f8;
            font-size: 0.95rem;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>

    <!-- Import Three.js ผ่าน CDN jsDelivr -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>

    <!-- Loading Screen -->
    <div id="loader">
        <div class="spinner"></div>
        <p id="progress-text" class="progress-text">กำลังเดินทางสู่อวกาศ (0%)...</p>
    </div>

    <!-- 3D Canvas Container -->
    <div id="webgl-container"></div>

    <!-- User Interface -->
    <div class="ui-container">
        <header>
            <h1>Chotchayut Biewbangkoed</h1>
            <p class="subtitle">3D Artist & Interactive Developer</p>
            <p class="bio">
                ยินดีต้อนรับสู่ Interactive 3D Portfolio ในธีมอวกาศ พร้อมการแสดงผลโมเดล 3D แบบเรียลไทม์
            </p>
        </header>

        <footer>
            💡 ใช้เมาส์: <b>คลิกซ้าย drag</b> เพื่อหมุน | <b>Scroll</b> เพื่อซูม | <b>คลิกขวา drag</b> เพื่อย้ายมุมกล้อง
        </footer>
    </div>

    <!-- Main 3D Script -->
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        let scene, camera, renderer, controls, starParticles;

        function init() {
            const container = document.getElementById('webgl-container');

            // 1. Scene Setup
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x020208); // สีอวกาศมืดอมม่วง/น้ำเงิน
            scene.fog = new THREE.FogExp2(0x020208, 0.015); // หมอกอวกาศตื้นๆ

            // 2. Camera Setup
            camera = new THREE.PerspectiveCamera(
                45, 
                window.innerWidth / window.innerHeight, 
                0.1, 
                1000
            );
            camera.position.set(0, 0, 4);

            // 3. Renderer Setup
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.2;
            renderer.outputColorSpace = THREE.SRGBColorSpace;
            container.appendChild(renderer.domElement);

            // 4. OrbitControls
            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.minDistance = 1;
            controls.maxDistance = 10;
            controls.autoRotate = true;
            controls.autoRotateSpeed = 0.8;

            // 5. Lighting Setup (โทนไซไฟอวกาศ)
            const ambientLight = new THREE.AmbientLight(0x223355, 1.5); // แสงบรรยากาศสีฟ้ามืด
            scene.add(ambientLight);

            // แสงหลักหลัก (สีขาวสว่างเหมือนแสงอาทิตย์ในอวกาศ)
            const mainLight = new THREE.DirectionalLight(0xffffff, 2.5);
            mainLight.position.set(5, 5, 5);
            scene.add(mainLight);

            // แสงสะท้อนสีฟ้าสดใสจากด้านข้าง (Cyan Rim Light)
            const cyanLight = new THREE.PointLight(0x00f2fe, 3, 20);
            cyanLight.position.set(-5, -2, -3);
            scene.add(cyanLight);

            // แสงสะท้อนสีม่วงจากด้านล่าง (Purple Rim Light)
            const purpleLight = new THREE.PointLight(0x9b51e0, 3, 20);
            purpleLight.position.set(3, -4, 2);
            scene.add(purpleLight);

            // 6. สร้างระบบฝูงดวงดาวในอวกาศ (Starfield Generator)
            createStarfield();

            // 7. Loading Manager
            const progressText = document.getElementById('progress-text');
            const manager = new THREE.LoadingManager();

            manager.onProgress = function (url, itemsLoaded, itemsTotal) {
                const percent = Math.round((itemsLoaded / itemsTotal) * 100);
                progressText.innerText = `กำลังโหลดโมเดล 3D... ${percent}%`;
            };

            manager.onLoad = function () {
                const loaderElement = document.getElementById('loader');
                loaderElement.style.opacity = '0';
                setTimeout(() => loaderElement.style.display = 'none', 500);
            };

            manager.onError = function (url) {
                console.error('ไม่สามารถโหลดไฟล์ได้:', url);
                progressText.innerText = 'เกิดข้อผิดพลาดในการโหลดโมเดล (ตรวจสอบไฟล์ .glb)';
            };

            // 8. โหลดโมเดล 3D ที่คุณดาวน์โหลดมาจาก Sketchfab
            // ⚠️ กรุณาเปลี่ยนชื่อไฟล์ให้ตรงกับไฟล์ที่คุณดาวน์โหลดมาวางไว้
            const modelUrl = './my-model.glb'; 

            const gltfLoader = new GLTFLoader(manager);
            gltfLoader.load(modelUrl, function (gltf) {
                const model = gltf.scene;

                // จัดตำแหน่งให้อยู่ตรงกลางของ Scene
                const box = new THREE.Box3().setFromObject(model);
                const center = box.getCenter(new THREE.Vector3());
                model.position.sub(center); 

                scene.add(model);
            });

            // Window Resize Listener
            window.addEventListener('resize', onWindowResize);
        }

        // ฟังก์ชันสร้างฝูงดาวในอวกาศ
        function createStarfield() {
            const count = 2500;
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(count * 3);
            const colors = new Float32Array(count * 3);

            for (let i = 0; i < count * 3; i += 3) {
                // สุ่มตำแหน่งกระจายรอบๆ ตัวผู้เล่น
                positions[i] = (Math.random() - 0.5) * 100;
                positions[i + 1] = (Math.random() - 0.5) * 100;
                positions[i + 2] = (Math.random() - 0.5) * 100;

                // สุ่มสีดวงดาว (ฟ้า, ขาว, เหลืองอ่อน)
                const colorChoice = Math.random();
                if (colorChoice > 0.7) {
                    colors[i] = 0.5; colors[i + 1] = 0.8; colors[i + 2] = 1.0; // ฟ้า
                } else if (colorChoice > 0.4) {
                    colors[i] = 1.0; colors[i + 1] = 1.0; colors[i + 2] = 1.0; // ขาว
                } else {
                    colors[i] = 1.0; colors[i + 1] = 0.9; colors[i + 2] = 0.7; // เหลืองอ่อน
                }
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            const material = new THREE.PointsMaterial({
                size: 0.15,
                vertexColors: true,
                transparent: true,
                opacity: 0.8
            });

            starParticles = new THREE.Points(geometry, material);
            scene.add(starParticles);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // Animation Loop
        function animate() {
            requestAnimationFrame(animate);

            // หมุนดวงดาวช้าๆ ให้ดูเคลื่อนไหว
            if (starParticles) {
                starParticles.rotation.y += 0.0003;
                starParticles.rotation.x += 0.0001;
            }

            controls.update();
            renderer.render(scene, camera);
        }

        // Start Application
        init();
        animate();
    </script>
</body>
</html>
