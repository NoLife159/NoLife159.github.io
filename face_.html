<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MindAR Blendshape</title>
  <script type="importmap">
    { "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
      "mindar-face-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-face-three.prod.js"
    } }
  </script>
  <style>
    body { margin: 0; overflow: hidden; }
    #container { width: 100vw; height: 100vh; position: relative; }
  </style>
</head>
<body>
  <div id="container"></div>
  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
    import { MindARThree } from 'mindar-face-three';

    async function start() {
      const mindar = new MindARThree({ container: document.querySelector('#container') });
      const { renderer, scene, camera } = mindar;

      // เริ่มการทำงานของ MindAR (จะเด้งขออนุญาตใช้กล้อง)
      await mindar.start();

      // สร้าง environment texture
      const pmremGenerator = new THREE.PMREMGenerator(renderer);
      const roomEnvironment = new RoomEnvironment();
      const environmentTarget = pmremGenerator.fromScene(roomEnvironment);
      scene.environment = environmentTarget.texture;
      roomEnvironment.dispose();
      pmremGenerator.dispose();
      
      scene.add(new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1));

      // แก้ไข URL โหลดโมเดลให้ถูกต้อง
      const gltf = await new GLTFLoader().loadAsync('./RoBot_Head.glb');
      const model = gltf.scene;
      
      model.scale.setScalar(2);
      mindar.addAnchor(1).group.add(model);

      const meshes = [];
      model.traverse(object => {
        if (object.isMesh && object.morphTargetDictionary && object.morphTargetInfluences) {
          meshes.push(object);
        }
      });

      function animate() {
        const categories = mindar.getLatestEstimate()?.blendshapes?.categories;
        for (const mesh of meshes) {
          for (const { categoryName, score } of categories ?? []) {
            const index = mesh.morphTargetDictionary[categoryName];
            if (index !== undefined) {
              mesh.morphTargetInfluences[index] = score;
            }
          }
        }
        renderer.render(scene, camera);
        requestAnimationFrame(animate);
      }
      animate();
    }

    start().catch(err => {
      console.error("Error starting app:", err);
    });
  </script>
</body>
</html>
